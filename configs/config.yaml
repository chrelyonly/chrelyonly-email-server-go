server:
  name: chrelyonly-mail-server
  http_addr: 127.0.0.1:18080

smtp:
  hostname: 192.168.10.70
  ports:
    smtp: 25
    smtps: 465
    submission: 587
  tls:
    enabled: false
    cert_file: "1"
    key_file: "2"

imap:
  enabled: true
  port: 143             # IMAP 服务监听端口 (默认 143)

database:
  driver: mysql
  dsn: chrelyonly-email:hSf3Yfx5PY2ry7cM@tcp(192.168.10.47:3306)/chrelyonly-email?parseTime=true&charset=utf8mb4&loc=Local

storage:
  message_path: ./data/messages
  attachment_path: ./data/attachments
  max_message_size: 26214400
  max_attachment_size: 20971520

webhook:
  enabled: false
  url: http://127.0.0.1:8078/internal/mail/webhook
  secret: CHANGE_ME_SECRET_KEY
  retry: true
  max_retries: 10

security:
  max_connections: 500
  max_auth_attempts: 5

logger:
  level: info           # 日志级别: debug / info / warn / error
  encoding: console     # 日志输出格式: console (彩色控制台文本) / json (标准JSON格式)
  output_paths:         # 日志输出目的地列表
    - stdout            # 终端控制台
    - ./logs/server.log # 本地日志文件
