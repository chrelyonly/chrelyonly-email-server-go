server:
  name: chrelyonly-mail-server
  http_addr: 127.0.0.1:18080

smtp:
  hostname: mail.chrelyonly.cn
  ports:
    smtp: 25
    smtps: 465
    submission: 587
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

database:
  driver: mysql
  dsn: root:123456@tcp(127.0.0.1:3306)/chrelyonly_mail_server?parseTime=true&charset=utf8mb4&loc=Local

storage:
  message_path: ./data/messages
  attachment_path: ./data/attachments
  max_message_size: 26214400 # 25MB
  max_attachment_size: 20971520 # 20MB

webhook:
  enabled: true
  url: http://127.0.0.1:8078/internal/mail/webhook
  secret: CHANGE_ME_SECRET_KEY
  retry: true
  max_retries: 10

security:
  max_connections: 500
  max_auth_attempts: 5

logger:
  level: info           # 日志级别: debug / info / warn / error
  encoding: console     # 日志格式: console (彩色文本, 调试方便) / json (JSON格式, 适合收集)
  output_paths:         # 日志输出输出路径列表
    - stdout            # 输出到终端控制台
    - ./logs/server.log # 同时输出保存到本地文件
